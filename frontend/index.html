<!doctype html>
<html lang="en" data-accent="blue" data-accent-default="blue">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="description" content="Countersign: sign in with a demo account to try it." />
    <title>Countersign</title>
    <script>
      // Sets the `dark` class before first paint, so the page never flashes
      // light before switching. Keep this inline and above the stylesheet.
      (function () {
        try {
          var media = window.matchMedia("(prefers-color-scheme: dark)");
          var saved = null; try { saved = localStorage.getItem("kit.theme"); } catch (e) {}
          var dark = saved ? saved === "dark" : media.matches;
          document.documentElement.classList.toggle("dark", dark);
          var accent = null; try { accent = localStorage.getItem("kit.accent"); } catch (e) {}
          if (accent && ["indigo","blue","sky","teal","green","amber","orange","rose","violet","graphite"].indexOf(accent) >= 0) document.documentElement.dataset.accent = accent;
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
